<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANISKA MONDAL GAME HUB - Pro 3 Guti</title>
    <!-- PeerJS for WebRTC P2P Connection -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Canvas Confetti for Targeted Fireworks -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 10px 15px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1f0436 0%, #3d0746 50%, #6a0944 100%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            color: #ffeb3b;
            text-shadow: 0 0 15px rgba(255, 235, 59, 0.6), 0 0 25px rgba(233, 30, 99, 0.8);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #f48fb1;
            margin-top: 3px;
            font-weight: 600;
        }

        /* Top Online/Offline Status Indicator */
        .conn-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            background: rgba(0,0,0,0.4);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.15);
            margin-bottom: 8px;
        }

        .conn-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #aaa;
        }

        .conn-dot.online {
            background: #00e676;
            box-shadow: 0 0 10px #00e676;
        }

        /* Invite Controls */
        .controls {
            width: 100%;
            max-width: 380px;
            margin-bottom: 8px;
        }

        .share-btn {
            background: linear-gradient(45deg, #ff007f, #7928ca);
            color: #ffffff;
            border: none;
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            transition: transform 0.2s;
        }

        .share-btn:active { transform: scale(0.97); }

        .turn-announcer {
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 28px;
            margin-bottom: 10px;
            text-align: center;
            color: #ffeb3b;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
        }

        /* Responsive Layout Container: Scoreboards on left & right */
        .game-arena {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            max-width: 1000px;
            margin: auto 0;
        }

        /* Dashboard Player Cards */
        .player-dashboard {
            width: 170px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            padding: 18px 12px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .dashboard-baba {
            border-color: rgba(0, 210, 255, 0.4);
        }
        .dashboard-baba.winner-active {
            border-color: #00d2ff;
            box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
            transform: scale(1.06);
            animation: pulse-border 1.5s infinite;
        }

        .dashboard-taniska {
            border-color: rgba(255, 42, 133, 0.4);
        }
        .dashboard-taniska.winner-active {
            border-color: #ff2a85;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.8);
            transform: scale(1.06);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { transform: scale(1.04); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1.04); }
        }

        .player-avatar {
            font-size: 2.2rem;
            margin-bottom: 4px;
            position: relative;
        }

        .crown-icon {
            display: none;
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.8rem;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-6px); }
        }

        .player-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .baba-title { color: #00d2ff; text-shadow: 0 0 8px rgba(0,210,255,0.6); }
        .taniska-title { color: #ff66aa; text-shadow: 0 0 8px rgba(255,102,170,0.6); }

        .player-tag {
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        /* Digital LCD Score Box */
        .digital-score-box {
            background: rgba(0, 0, 0, 0.65);
            border-radius: 12px;
            padding: 8px 5px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .score-label {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffd54f;
            margin-bottom: 2px;
        }

        .score-value {
            font-size: 2.4rem;
            font-weight: 900;
            font-family: 'Courier New', Courier, monospace;
            line-height: 1;
        }

        .score-baba { color: #00e5ff; text-shadow: 0 0 12px rgba(0, 229, 255, 0.7); }
        .score-taniska { color: #ff4081; text-shadow: 0 0 12px rgba(255, 64, 129, 0.7); }

        /* Game Board */
        .board-container {
            position: relative;
            width: 320px;
            height: 320px;
            background: rgba(20, 5, 35, 0.88);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 0 25px rgba(255, 42, 133, 0.25);
            border: 3px solid #ff77a9;
            touch-action: manipulation;
            flex-shrink: 0;
        }

        svg.board-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        line {
            stroke: rgba(255, 255, 255, 0.65);
            stroke-width: 4;
            stroke-linecap: round;
        }

        /* 9 Nodes */
        .node {
            position: absolute;
            width: 54px;
            height: 54px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(30, 10, 50, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .node.valid-target {
            border-color: #00e676 !important;
            box-shadow: 0 0 16px #00e676;
            animation: pulse-ring 1s infinite alternate;
        }

        @keyframes pulse-ring {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.18); }
        }

        .node.selected {
            border-color: #ffeb3b !important;
            box-shadow: 0 0 18px #ffeb3b;
            transform: translate(-50%, -50%) scale(1.12);
        }

        /* Guti / Beads */
        .guti {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .guti-blue {
            background: radial-gradient(circle at 30% 30%, #a0e8ff, #0077b6 60%, #001f3f 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 12px rgba(0, 195, 255, 0.8);
        }

        .guti-pink {
            background: radial-gradient(circle at 30% 30%, #ffb6c1, #ff1493 60%, #52002b 100%);
            border: 2px solid #ffffff;
            box-shadow: 0 0 12px rgba(255, 20, 147, 0.8);
        }

        .board-locked {
            pointer-events: none !important;
            opacity: 0.95;
        }

        .reset-btn {
            display: none;
            margin-top: 14px;
            background: #ffeb3b;
            color: #21033a;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 235, 59, 0.5);
            transition: transform 0.2s;
        }
        .reset-btn:hover { transform: scale(1.05); }

        .guide-box {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px 14px;
            margin-top: 12px;
            font-size: 0.78rem;
            line-height: 1.4;
            color: #f8bbd0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        /* Mobile Adjustments */
        @media (max-width: 720px) {
            .game-arena {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 12px;
            }
            .player-dashboard {
                width: 45%;
                padding: 10px 8px;
            }
            .player-avatar { font-size: 1.6rem; }
            .score-value { font-size: 1.8rem; }
            .board-container { order: 3; }
        }
    </style>
</head>
<body>

    <header>
        <h1>TANISKA MONDAL GAME HUB</h1>
        <div class="subtitle">✨ আসল ৩ গুটি (Tin Guti Live Arena) ✨</div>
    </header>

    <!-- Top Connection Status -->
    <div class="conn-pill">
        <span id="conn-led" class="conn-dot"></span>
        <span id="conn-text">অফলাইন</span>
    </div>

    <!-- Invite Control -->
    <div class="controls" id="invite-panel">
        <button class="share-btn" onclick="shareGameLink()">🔗 তানিস্কার জন্য গেম লিংক কপি করুন</button>
    </div>

    <!-- Live Turn Message -->
    <div class="turn-announcer" id="turn-announcer">কানেকশন তৈরি হচ্ছে...</div>

    <!-- Main Game Arena with Side Scoreboards -->
    <div class="game-arena">
        <!-- Left Dashboard: BABA -->
        <div class="player-dashboard dashboard-baba" id="card-baba">
            <div class="player-avatar">
                <span class="crown-icon" id="crown-baba">👑</span>
                👨
            </div>
            <div class="player-title baba-title">বাবা</div>
            <div class="player-tag">(Blue Guti)</div>
            <div class="digital-score-box">
                <div class="score-label">Round Score</div>
                <div class="score-value score-baba" id="score-baba">0</div>
            </div>
        </div>

        <!-- Center: Game Board -->
        <div class="board-container" id="board-container">
            <svg class="board-lines" viewBox="0 0 320 320">
                <!-- Outer Square -->
                <line x1="40" y1="40" x2="280" y2="40" />
                <line x1="280" y1="40" x2="280" y2="280" />
                <line x1="280" y1="280" x2="40" y2="280" />
                <line x1="40" y1="280" x2="40" y2="40" />
                <!-- Middle Cross -->
                <line x1="40" y1="160" x2="280" y2="160" />
                <line x1="160" y1="40" x2="160" y2="280" />
                <!-- Diagonals -->
                <line x1="40" y1="40" x2="280" y2="280" />
                <line x1="280" y1="40" x2="40" y2="280" />
            </svg>

            <!-- 9 Nodes -->
            <div class="node" id="n0" style="top: 40px; left: 40px;" onclick="handleNodeClick(0)"></div>
            <div class="node" id="n1" style="top: 40px; left: 160px;" onclick="handleNodeClick(1)"></div>
            <div class="node" id="n2" style="top: 40px; left: 280px;" onclick="handleNodeClick(2)"></div>
            <div class="node" id="n3" style="top: 160px; left: 40px;" onclick="handleNodeClick(3)"></div>
            <div class="node" id="n4" style="top: 160px; left: 160px;" onclick="handleNodeClick(4)"></div>
            <div class="node" id="n5" style="top: 160px; left: 280px;" onclick="handleNodeClick(5)"></div>
            <div class="node" id="n6" style="top: 280px; left: 40px;" onclick="handleNodeClick(6)"></div>
            <div class="node" id="n7" style="top: 280px; left: 160px;" onclick="handleNodeClick(7)"></div>
            <div class="node" id="n8" style="top: 280px; left: 280px;" onclick="handleNodeClick(8)"></div>
        </div>

        <!-- Right Dashboard: TANISKA -->
        <div class="player-dashboard dashboard-taniska" id="card-taniska">
            <div class="player-avatar">
                <span class="crown-icon" id="crown-taniska">👑</span>
                👧
            </div>
            <div class="player-title taniska-title">তানিস্কা</div>
            <div class="player-tag">(Pink Guti)</div>
            <div class="digital-score-box">
                <div class="score-label">Round Score</div>
                <div class="score-value score-taniska" id="score-taniska">0</div>
            </div>
        </div>
    </div>

    <button id="reset-btn" class="reset-btn" onclick="restartGame()">🔄 পরবর্তী রাউন্ড খেলুন</button>

    <div class="guide-box">
        💡 <b>নিয়ম:</b> নিজের গুটিতে চাপ দিয়ে পাশের সবুজ ফাঁকা ঘরে চাপ দিন। যে ৩টি গুটি এক লাইনে আনবে সে ১ পয়েন্ট পাবে এবং আতশবাজি ফুটবে!
    </div>

    <script>
        const ADJACENT_MAP = {
            0: [1, 3, 4],
            1: [0, 2, 4],
            2: [1, 4, 5],
            3: [0, 4, 6],
            4: [0, 1, 2, 3, 5, 6, 7, 8],
            5: [2, 4, 8],
            6: [3, 4, 7],
            7: [4, 6, 8],
            8: [4, 5, 7]
        };

        const WIN_PATTERNS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        let peer = null;
        let conn = null;
        let myRole = null; // 'BLUE' (Baba) or 'PINK' (Taniska)
        let selectedIndex = null;

        // Shared Game State with Persistent Scores
        let gameState = {
            board: ['BLUE', 'BLUE', 'BLUE', null, null, null, 'PINK', 'PINK', 'PINK'],
            turn: 'BLUE',
            winner: null,
            scoreBaba: 0,
            scoreTaniska: 0
        };

        function initApp() {
            peer = new Peer();

            peer.on('open', id => {
                const params = new URLSearchParams(window.location.search);
                const joinId = params.get('game');

                if (joinId) {
                    myRole = 'PINK'; // Daughter
                    document.getElementById('invite-panel').style.display = 'none';
                    connectToHost(joinId);
                } else {
                    myRole = 'BLUE'; // Baba
                    document.getElementById('turn-announcer').innerText = "তানিস্কার যুক্ত হওয়ার জন্য লিংক পাঠান...";
                }
                updateUI();
            });

            peer.on('connection', connection => {
                conn = connection;
                setupEvents();
            });
        }

        function connectToHost(hostId) {
            conn = peer.connect(hostId);
            setupEvents();
        }

        function setupEvents() {
            conn.on('open', () => {
                setOnline(true);
                if (myRole === 'BLUE') {
                    conn.send({ type: 'SYNC', state: gameState });
                }
                updateUI();
            });

            conn.on('data', data => {
                if (data.type === 'SYNC') {
                    const prevWinner = gameState.winner;
                    gameState = data.state;
                    selectedIndex = null;
                    clearHighlights();
                    updateUI();

                    // If a new winner is registered, trigger targeted fireworks
                    if (gameState.winner && prevWinner !== gameState.winner) {
                        celebrateWinner(gameState.winner);
                    }
                }
            });

            conn.on('close', () => {
                setOnline(false);
                document.getElementById('turn-announcer').innerText = "সংযোগ বিচ্ছিন্ন হয়েছে!";
            });
        }

        function setOnline(isOnline) {
            const led = document.getElementById('conn-led');
            const txt = document.getElementById('conn-text');
            if (isOnline) {
                led.className = 'conn-dot online';
                txt.innerText = 'অনলাইন';
                txt.style.color = '#00e676';
            } else {
                led.className = 'conn-dot';
                txt.innerText = 'অফলাইন';
                txt.style.color = '#aaa';
            }
        }

        function shareGameLink() {
            if (!peer || !peer.id) {
                alert("কানেকশন তৈরি হচ্ছে, ২ সেকেন্ড অপেক্ষা করুন...");
                return;
            }
            const gameUrl = `${window.location.origin}${window.location.pathname}?game=${peer.id}`;
            navigator.clipboard.writeText(gameUrl).then(() => {
                alert("গেম লিংক কপি হয়েছে! তানিস্কার কাছে পাঠিয়ে দিন।");
            }).catch(() => {
                prompt("লিংকটি কপি করে পাঠান:", gameUrl);
            });
        }

        function handleNodeClick(index) {
            if (gameState.winner) return;

            if (!conn || !conn.open) {
                alert("আপনার মেয়ে এখনও অনলাইন যুক্ত হয়নি! লিংকটি তাকে পাঠান।");
                return;
            }

            if (gameState.turn !== myRole) return;

            const clickedPiece = gameState.board[index];

            // 1. Select own piece
            if (clickedPiece === myRole) {
                selectedIndex = index;
                highlightOptions(index);
                return;
            }

            // 2. Move to adjacent empty cell
            if (selectedIndex !== null && clickedPiece === null) {
                if (ADJACENT_MAP[selectedIndex].includes(index)) {
                    gameState.board[index] = myRole;
                    gameState.board[selectedIndex] = null;
                    selectedIndex = null;
                    clearHighlights();

                    // Check if this move wins the game
                    if (checkWin(myRole)) {
                        gameState.winner = myRole;
                        if (myRole === 'BLUE') {
                            gameState.scoreBaba++;
                        } else {
                            gameState.scoreTaniska++;
                        }
                        celebrateWinner(myRole);
                    } else {
                        gameState.turn = (myRole === 'BLUE') ? 'PINK' : 'BLUE';
                    }

                    conn.send({ type: 'SYNC', state: gameState });
                    updateUI();
                }
            }
        }

        function highlightOptions(sourceIndex) {
            clearHighlights();
            document.getElementById(`n${sourceIndex}`).classList.add('selected');

            ADJACENT_MAP[sourceIndex].forEach(target => {
                if (gameState.board[target] === null) {
                    document.getElementById(`n${target}`).classList.add('valid-target');
                }
            });
        }

        function clearHighlights() {
            for (let i = 0; i < 9; i++) {
                const node = document.getElementById(`n${i}`);
                node.classList.remove('selected', 'valid-target');
            }
        }

        function checkWin(player) {
            return WIN_PATTERNS.some(combo =>
                combo.every(idx => gameState.board[idx] === player)
            );
        }

        // Targeted Fireworks directly over the winner's dashboard card
        function celebrateWinner(winner) {
            const cardId = (winner === 'BLUE') ? 'card-baba' : 'card-taniska';
            const cardEl = document.getElementById(cardId);
            const rect = cardEl.getBoundingClientRect();

            // Calculate card center coordinate normalized to 0..1 for confetti
            const x = (rect.left + rect.width / 2) / window.innerWidth;
            const y = (rect.top + rect.height / 2) / window.innerHeight;

            const colors = (winner === 'BLUE') ? ['#00d2ff', '#0077b6', '#ffffff', '#ffd54f'] : ['#ff2a85', '#ff77a9', '#ffffff', '#ffeb3b'];

            // Fireworks blast loop
            let end = Date.now() + 2500;
            (function frame() {
                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 65,
                    origin: { x: Math.max(0, x - 0.05), y: y },
                    colors: colors
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 65,
                    origin: { x: Math.min(1, x + 0.05), y: y },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function restartGame() {
            // Retain scores, reset only the board layout
            gameState.board = ['BLUE', 'BLUE', 'BLUE', null, null, null, 'PINK', 'PINK', 'PINK'];
            gameState.turn = (gameState.winner === 'BLUE') ? 'PINK' : 'BLUE'; // Alternating start
            gameState.winner = null;
            selectedIndex = null;
            clearHighlights();

            if (conn && conn.open) {
                conn.send({ type: 'SYNC', state: gameState });
            }
            updateUI();
        }

        function updateUI() {
            const boardContainer = document.getElementById('board-container');
            const announcer = document.getElementById('turn-announcer');
            const resetBtn = document.getElementById('reset-btn');
            
            const scoreBabaEl = document.getElementById('score-baba');
            const scoreTaniskaEl = document.getElementById('score-taniska');
            const cardBaba = document.getElementById('card-baba');
            const cardTaniska = document.getElementById('card-taniska');
            const crownBaba = document.getElementById('crown-baba');
            const crownTaniska = document.getElementById('crown-taniska');

            // 1. Update Scores
            scoreBabaEl.innerText = gameState.scoreBaba;
            scoreTaniskaEl.innerText = gameState.scoreTaniska;

            // 2. Render Beads on Board
            for (let i = 0; i < 9; i++) {
                const cell = document.getElementById(`n${i}`);
                cell.innerHTML = '';
                if (gameState.board[i] === 'BLUE') {
                    cell.innerHTML = '<div class="guti guti-blue"></div>';
                } else if (gameState.board[i] === 'PINK') {
                    cell.innerHTML = '<div class="guti guti-pink"></div>';
                }
            }

            // 3. Clear Previous Winner Highlight Classes
            cardBaba.classList.remove('winner-active');
            cardTaniska.classList.remove('winner-active');
            crownBaba.style.display = 'none';
            crownTaniska.style.display = 'none';

            // 4. Winner State Handling
            if (gameState.winner) {
                boardContainer.classList.add('board-locked');
                resetBtn.style.display = 'inline-block';

                if (gameState.winner === 'BLUE') {
                    cardBaba.classList.add('winner-active');
                    crownBaba.style.display = 'block';
                    announcer.innerHTML = (myRole === 'BLUE') ? "🏆 বাবা এই রাউন্ডে জিতে গেছেন! 🎆" : "বাবা জিতে গেছেন! পরের রাউন্ডে জিতুন!";
                    announcer.style.color = "#00e5ff";
                } else {
                    cardTaniska.classList.add('winner-active');
                    crownTaniska.style.display = 'block';
                    announcer.innerHTML = (myRole === 'PINK') ? "🎉 তানিস্কা এই রাউন্ডে জিতে গেছে! 🥳👑" : "🎉 তানিস্কা এই রাউন্ডে জিতে গেছে! 🥳👑";
                    announcer.style.color = "#ff4081";
                }
                return;
            }

            resetBtn.style.display = 'none';

            // 5. Turn State & Lock
            if (!conn || !conn.open) {
                boardContainer.classList.add('board-locked');
                return;
            }

            if (gameState.turn === myRole) {
                boardContainer.classList.remove('board-locked');
                announcer.innerText = "🎲 আপনার চাল! নিজের গুটিতে চাপ দিন।";
                announcer.style.color = "#ffeb3b";
            } else {
                boardContainer.classList.add('board-locked');
                const waitingName = (myRole === 'BLUE') ? "তানিস্কার" : "বাবার";
                announcer.innerText = `⏳ ${waitingName} চালের জন্য অপেক্ষা করুন...`;
                announcer.style.color = "#f48fb1";
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
